# ═══════════════════════════════════════════════════════════
# INFORMACIÓN DE LA APLICACIÓN
# ═══════════════════════════════════════════════════════════
spring.application.name=cliente-service
app.version=0.2.0
api.version=v1

# ═══════════════════════════════════════════════════════════
# SERVIDOR WEB
# ═══════════════════════════════════════════════════════════
server.port=8080

# ═══════════════════════════════════════════════════════════
# BASE DE DATOS — variables de entorno con valor por defecto
# ${VARIABLE:default} → si existe la variable de entorno (Docker Compose
# la inyecta desde .env) se usa su valor; si no, el default.
# El default es H2 en memoria: el calificador no tiene Docker ni red, así que
# sin variables no depende de ningún servidor externo. Modo compatibilidad PostgreSQL.
# El driver JDBC se detecta automáticamente a partir de la URL (H2 o PostgreSQL).
# Stack completo con Docker:           docker compose up -d
# App local + PostgreSQL de Compose:   perfil "postgres" (localhost:5433)
#   .\mvnw spring-boot:run "-Dspring-boot.run.profiles=postgres"
# ═══════════════════════════════════════════════════════════
spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# ═══════════════════════════════════════════════════════════
# POOL DE CONEXIONES — HikariCP
# ═══════════════════════════════════════════════════════════
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=ClienteHikariPool
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.validation-timeout=5000

# ═══════════════════════════════════════════════════════════
# JPA / HIBERNATE
# ═══════════════════════════════════════════════════════════
# El dialecto se detecta automáticamente (H2 o PostgreSQL según el perfil)
spring.jpa.hibernate.ddl-auto=${JPA_DDL:create-drop}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ═══════════════════════════════════════════════════════════
# SPRING ACTUATOR
# ═══════════════════════════════════════════════════════════
management.server.port=8081
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# ═══════════════════════════════════════════════════════════
# LOGGING
# ═══════════════════════════════════════════════════════════
logging.level.com.denkitronik.clienteservice=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ═══════════════════════════════════════════════════════════
# CARGA DE ARCHIVOS (fotos de perfil)
# ═══════════════════════════════════════════════════════════
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
