# ═══════════════════════════════════════════════════════════
# PERFIL "postgres" — app local (IntelliJ/mvnw) + PostgreSQL de Docker Compose
# 1) docker compose up -d postgres
# 2) .\mvnw spring-boot:run "-Dspring-boot.run.profiles=postgres"
# Compose publica PostgreSQL en el puerto 5433 de tu máquina (5432 dentro de la red Docker)
# ═══════════════════════════════════════════════════════════
spring.datasource.url=jdbc:postgresql://localhost:5433/curso_springboot
spring.datasource.username=${DB_USERNAME:devdb}
spring.datasource.password=${DB_PASSWORD:a1b2c3d4}
spring.datasource.driver-class-name=org.postgresql.Driver
